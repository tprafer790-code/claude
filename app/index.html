<!doctype html><html lang="es"><head><meta charset="utf-8">

</head><body><title>Sinapsis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 560px), barra de pestañas fija abajo; en misión, pantalla completa con una sola tarea a la vista. */
:root{
  --ink:#130E31;        /* fondo nocturno */
  --ink-2:#1D1748;      /* superficie */
  --ink-3:#2A2263;      /* superficie elevada */
  --line:rgba(226,218,255,.12);
  --fg:#F6F3FF;
  --muted:#B4ACDD;
  --coral:#FF6A55;
  --sun:#FFC83D;
  --mint:#2EE0A4;
  --sky:#53A9FF;
  --pink:#FF5DA9;
  --violet:#9C7CFF;
  --on-bright:#130E31;
  --display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(40% 30% at 15% 10%, color-mix(in srgb,var(--violet) 45%,transparent), transparent 70%),
    radial-gradient(35% 28% at 90% 20%, color-mix(in srgb,var(--pink) 30%,transparent), transparent 70%),
    radial-gradient(45% 35% at 70% 95%, color-mix(in srgb,var(--sky) 28%,transparent), transparent 70%);
  animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-4%,0) rotate(6deg)}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:32px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px}
.brand svg{width:34px;height:34px}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line);font-weight:700;font-size:15px}
.pill .dot{width:10px;height:10px;border-radius:50%}
.flame{color:var(--sun)}

/* Nivel */
.level{padding:14px 16px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line)}
.bar{height:12px;border-radius:999px;background:var(--ink-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* Héroe de misión: el único bloque estridente */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 20px 20px;color:var(--on-bright);
  background:linear-gradient(135deg,var(--sun) 0%,var(--coral) 45%,var(--pink) 75%,var(--violet) 100%);box-shadow:0 20px 50px -18px color-mix(in srgb,var(--coral) 70%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.45),transparent 65%)}
.hero h2{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;margin-top:8px}
.hero .sub{font-weight:700;font-size:17px;margin-top:6px;max-width:30ch}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .chip{background:rgba(19,14,49,.14);border-radius:999px;padding:5px 11px;font-weight:700;font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;margin-top:18px;border-radius:999px;
  background:var(--ink);color:var(--fg);font-family:var(--display);font-weight:700;font-size:18px;transition:transform .12s}
.cta:active{transform:scale(.97)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;font-weight:800;font-size:17px;transition:transform .12s, background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--fg);color:var(--on-bright)}
.btn.ghost{background:var(--ink-2);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.mint{background:var(--mint);color:var(--on-bright)}
.btn.coral{background:var(--coral);color:var(--on-bright)}
.btn.sky{background:var(--sky);color:var(--on-bright)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);border:1px solid var(--line);font-size:20px;flex:none}

/* Tarjetas genéricas */
.panel{border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:var(--r-md);padding:14px;background:var(--ink-2);border:1px solid var(--line);min-width:0}
.tile .v{font-family:var(--display);font-weight:800;font-size:28px}
.quick{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line)}
.quick .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;color:var(--on-bright)}
.quick b{display:block;font-size:17px}

/* Ley del día */
.law{border-radius:var(--r-md);padding:16px;background:linear-gradient(160deg,var(--ink-3),var(--ink-2));border:1px solid var(--line)}
.k{display:inline-block;font-family:var(--display);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;color:var(--on-bright)}
.law h3{font-size:20px;margin-top:10px}
.law .tt{display:grid;gap:8px;margin-top:12px}
.law .tt div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.law .tt b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}

/* Mazos */
.deck{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--c) 14%,var(--ink-2));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.mono{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:var(--on-bright);font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.deck .info{min-width:0;flex:1}
.deck .name{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--ink-3);margin-top:8px}
.seg i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--d);margin-right:6px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:800;background:var(--ink-3)}
.tag.warn{background:color-mix(in srgb,var(--sun) 25%,var(--ink-3));color:var(--sun)}
.tag.bad{background:color-mix(in srgb,var(--coral) 25%,var(--ink-3));color:var(--coral)}
.tag.good{background:color-mix(in srgb,var(--mint) 22%,var(--ink-3));color:var(--mint)}

/* Formularios */
label.f{display:grid;gap:6px;font-weight:700;font-size:15px}
input[type=text],input[type=date],textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--ink);font-size:17px;line-height:1.4}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--sky)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid transparent}
.swatch[aria-pressed=true]{border-color:var(--fg)}
.check{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--ink-2);border:1.5px solid var(--line);text-align:left;width:100%;font-weight:700}
.check .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;font-weight:800}
.check[aria-pressed=true]{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 12%,var(--ink-2))}
.check[aria-pressed=true] .box{background:var(--mint);border-color:var(--mint);color:var(--on-bright)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{padding:10px 16px;border-radius:999px;background:var(--ink-2);border:1.5px solid var(--line);font-weight:800}
.chipbtn[aria-pressed=true]{background:var(--fg);color:var(--on-bright);border-color:var(--fg)}

/* Pantalla de misión */
.mtop{display:flex;align-items:center;gap:12px}
.mtop .bar{flex:1}
.stage{margin-top:18px;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(14px) scale(.98);opacity:.2}}
.qcard{border-radius:var(--r-lg);padding:22px 20px;background:var(--ink-2);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 24px 60px -30px color-mix(in srgb,var(--c) 80%,transparent)}
.qcard .q{font-size:24px;font-weight:800;line-height:1.3;margin-top:12px}
.answer{border-radius:var(--r-md);padding:16px;background:color-mix(in srgb,var(--mint) 10%,var(--ink-2));border:1.5px solid color-mix(in srgb,var(--mint) 40%,transparent);animation:in .3s ease}
.answer .a{font-size:19px;font-weight:700;margin-top:6px;white-space:pre-wrap}
.mine{border-radius:var(--r-md);padding:14px;background:var(--ink-2);border:1px dashed var(--line);white-space:pre-wrap}
.hint{border-radius:var(--r-md);padding:12px 14px;background:color-mix(in srgb,var(--sun) 12%,var(--ink-2));border:1px solid color-mix(in srgb,var(--sun) 40%,transparent)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{min-height:84px;border-radius:20px;font-weight:800;font-size:16px;color:var(--on-bright);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.grade:active{transform:scale(.95)}
.grade small{font-weight:700;font-size:12px;opacity:.75}
.grade.ok{background:var(--mint)}.grade.mid{background:var(--sun)}.grade.no{background:var(--coral)}
.ai{border-radius:var(--r-md);padding:14px;background:color-mix(in srgb,var(--sky) 12%,var(--ink-2));border:1px solid color-mix(in srgb,var(--sky) 40%,transparent)}
.ritual h1,.done h1{font-size:30px;line-height:1.15}

/* Temporizador de foco */
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto 0;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}

/* Mapa de calor */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:5px;background:var(--ink-3)}

/* Ruedita del objetivo diario */
.goal{display:flex;align-items:center;gap:16px}
.goal svg{width:72px;height:72px;transform:rotate(-90deg);flex:none}

/* Lista de tarjetas */
.cardrow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line);width:100%;text-align:left}
.cardrow .txt{min-width:0;flex:1}
.cardrow .txt b{display:block;overflow-wrap:anywhere}
.cardrow .txt span{display:block;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.dots{display:flex;gap:4px;flex:none;margin-top:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink-3);border:1.5px solid var(--muted)}
.dots i.on{background:var(--mint);border-color:var(--mint)}

details.lawd{border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line);padding:4px 16px}
details.lawd summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;font-weight:800;font-size:17px}
details.lawd summary::-webkit-details-marker{display:none}
details.lawd .body{display:grid;gap:10px;padding-bottom:14px}

/* Barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--ink) 60%,transparent)}
.tabs nav{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--ink-2) 92%,transparent);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:18px;font-size:12px;font-weight:800;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{background:var(--fg);color:var(--on-bright)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;padding:12px 18px;border-radius:999px;background:var(--fg);color:var(--on-bright);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1);max-width:calc(100% - 32px);text-align:center}
@keyframes pop{from{transform:translate(-50%,-20px) scale(.8);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.empty{text-align:center;padding:28px 16px;border-radius:var(--r-md);border:1.5px dashed var(--line)}
.onb{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.onb .art{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;background:linear-gradient(135deg,var(--sun),var(--coral),var(--pink),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.onb h1{font-size:30px;line-height:1.15}
.onb .dotsnav{display:flex;gap:8px}.onb .dotsnav i{width:28px;height:6px;border-radius:9px;background:var(--ink-3)}.onb .dotsnav i.on{background:var(--fg)}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:380px){.hero .big{font-size:52px}.grade{font-size:14px}.qcard .q{font-size:21px}}
</style>

<div class="app" id="app"></div>
<div class="tabs" id="tabs"></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
"use strict";
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o));
const dayOf = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5);
const today = () => dayOf();
const dateToDay = (v) => { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const dayToDate = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n === 1 ? s : (p || s + "s");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLORS = ["#FF6A55", "#FFC83D", "#2EE0A4", "#53A9FF", "#FF5DA9", "#9C7CFF"];
const INTERVALS = [0, 2, 4]; // días hasta la siguiente evocación tras 1 y 2 aciertos (mínimo un día entre evocaciones)
const MAINTAIN = 14;          // repaso de mantenimiento cuando ya está dominada
const LEVELS = ["Neurona", "Dendrita", "Axón", "Sinapsis", "Red neuronal", "Hipocampo", "Corteza", "Mente en llamas", "Cerebro galáctico"];

/* ============ Las seis leyes (Aprender a aprender, Héctor Ruiz Martín) ============ */
const LAWS = [
  { k: "Relaciona", c: "#53A9FF", t: "Tu cerebro solo guarda lo que puede enganchar a algo que ya sabe.",
    truqui: "Busca a qué te recuerda: una palabra parecida, un ejemplo, una imagen, una historia absurda.",
    anti: "Repetir y repetir sin entender: se esfuma enseguida.",
    app: "Cada tarjeta tiene un campo «Relaciónalo». Al aprender algo nuevo, primero lo enganchas." },
  { k: "Recuerda", c: "#2EE0A4", t: "Aprendes cuando sacas la información de tu memoria, no cuando la vuelves a leer.",
    truqui: "Evoca: intenta recordar sin mirar. Cuanto más te cuesta, mejor se queda.",
    anti: "Releer, copiar, pasar a limpio, «primero le doy una miradita».",
    app: "Siempre respondes antes de ver la solución. Escribir o decirlo en voz alta cuenta." },
  { k: "Olvida", c: "#FFC83D", t: "Deja que se te olvide un poco y vuelve a evocar otro día: así se fija.",
    truqui: "Tres evocaciones correctas en tres días distintos = lo tienes.",
    anti: "Sobreestudiar un punto antes de pasar al siguiente. El atracón de la noche antes.",
    app: "Sinapsis te programa cada tarjeta: 1/3, 2/3, 3/3 con al menos un día entre medias y mezcla asignaturas." },
  { k: "Céntrate", c: "#FF5DA9", t: "Tu memoria de trabajo es un portapapeles pequeño. No lo llenes de ruido.",
    truqui: "Móvil fuera, sin música, una sola tarea, pausas de verdad. Escribe los pasos y dibuja.",
    anti: "Estudiar con música o contestando WhatsApp. Sesiones eternas sin parar.",
    app: "Ritual de foco antes de cada misión y temporizador de bloques cortos con descansos." },
  { k: "Confía", c: "#FF6A55", t: "Que algo te cueste al principio no significa que se te dé mal.",
    truqui: "Persevera, pide ayuda y trata el error como información para mejorar.",
    anti: "Pensar que la capacidad es innata: «yo es que no valgo para esto».",
    app: "Fallar también da experiencia: el esfuerzo de recordar ya está entrenando tu cerebro." },
  { k: "Colabora", c: "#9C7CFF", t: "Explicar a otra persona es una de las mejores formas de aprender.",
    truqui: "Pregúntaos unos a otros, explica lo que sabes, debate sin pelearte.",
    anti: "Pelearte por tener ideas distintas: es la disonancia cognitiva y el sesgo de confirmación.",
    app: "El «Reto en equipo» crea una lista de preguntas para que alguien te examine." },
];

const EXAMPLE = () => ({
  id: uid(), name: "Aprender a aprender", color: "#9C7CFF", exam: null, order: 0, example: true,
  cards: [
    ["¿Qué es evocar?", "Recuperar de la memoria lo aprendido sin mirar. Al evocar, el recuerdo se fija con más fuerza.", "Evocar = sacar un libro de la estantería de tu cerebro."],

/* ============ Lógica de aprendizaje ============ */
function deckById(id) { return S.decks.find(d => d.id === id); }

}
function isDue(c, t = today()) { return c.seen && c.due != null && c.due <= t; }

  return s;
}

  S.decks.forEach(d => { const x = deckStats(d); for (const k in s) s[k] += x[k]; });
  return s;
}
function clampToExam(d, due) {

    card.restudy = false;

    if (counts) { card.ok = 0; card.lapses = (card.lapses || 0) + 1; }
    card.due = t + 1; card.restudy = true;

}

let genCtl = null;

  const img = $("#g-img") && $("#g-img").files[0];
  if (!notes && !img) { G.err = "Pega algo de texto o elige una foto."; render(); return; }
  G.busy = true; G.err = ""; G.out = null; render();
  genCtl = new AbortController();
  const prompt = `Eres especialista en ciencia del aprendizaje (práctica de evocación, Héctor Ruiz Martín). A partir de los apuntes${img ? " de la imagen adjunta" : ""}, crea entre 8 y 20 tarjetas de evocación en español para un estudiante.

${notes.slice(0, 12000)}`;

}

/* ---------- Misión ---------- */
function startMission(opts = {}) {
  const t = today();
  let due = dueItems(opts.deckId), news = newItems(opts.deckId);
  let queue, learn;
  if (opts.quick) {
    queue = interleave(due).slice(0, 3);
    if (queue.length < 3) {
      const seen = []; S.decks.forEach(d => d.cards.forEach(c => { if (c.seen && !queue.some(q => q.cardId === c.id) && c.last !== t) seen.push({ deckId: d.id, cardId: c.id }); }));
      queue = queue.concat(shuffle(seen).slice(0, 3 - queue.length).map(x => ({ ...x, free: true })));
    }
    learn = queue.length ? [] : interleave(news).slice(0, 2);
  } else {
    queue = interleave(due).slice(0, opts.deckId ? 30 : S.profile.goal);
    learn = interleave(news).slice(0, 5);
    if (!queue.length && !learn.length) {
      const seen = []; S.decks.forEach(d => { if (opts.deckId && d.id !== opts.deckId) return; d.cards.forEach(c => { if (c.seen) seen.push({ deckId: d.id, cardId: c.id, free: true }); }); });
      queue = interleave(seen).slice(0, opts.deckId ? 10 : 3);
    }
  }
  M = { from: ui.screen === "deck" ? "deck" : null, step: opts.quick ? null : "ritual", queue: queue.map(x => ({ ...x, phase: "ev" })), i: 0, learn, li: 0, checks: [], ci: 0,
    res: { ok: 0, mid: 0, no: 0, counted: 0 }, xp: 0, t0: Date.now(), revealed: false, typed: "", hint: false, ai: null, ritual: {}, again: new Set() };
  if (!M.step) M.step = nextStep(null);
  ui.screen = "mission"; render(); scrollTo(0, 0);
}
function nextStep(cur) {
  const order = ["ritual", "ev", "learn", "checkIntro", "check", "done"];
  let i = cur ? order.indexOf(cur) + 1 : 1;
  for (; i < order.length; i++) {
    const s = order[i];
    if (s === "ev" && !M.queue.length) continue;
    if (s === "learn" && !M.learn.length) continue;
    if ((s === "checkIntro" || s === "check") && !M.checks.length) continue;
    return s;
  }
  return "done";
}
function vMission() {
  if (!M) { ui.screen = null; return vHoy(); }
  const total = M.queue.length + M.learn.length + M.checks.length;
  const doneN = M.i + M.li + M.ci;
  const top = `<div class="mtop"><button class="iconbtn" data-act="quitMission" aria-label="Salir de la misión">✕</button><div class="bar"><i style="width:${total ? doneN / total * 100 : 0}%"></i></div><span class="pill num">+${M.xp} XP</span></div>`;
  if (M.step === "ritual") {
    const items = [["phone", "Móvil fuera de la mesa o en modo avión"], ["music", "Sin música ni vídeos de fondo"], ["water", "Agua a mano (y algo de comer si hay hambre)"], ["one", "Solo esta tarea abierta"]];
    const all = items.every(([k]) => M.ritual[k]);
    return `${top}<section class="stage ritual stack"><p class="eyebrow">Ritual de foco · 30 segundos</p><h1>Prepara tu portapapeles mental</h1>
    <p class="muted">Tu memoria de trabajo es pequeña: cada distracción le quita sitio a lo que quieres aprender.</p>
    ${items.map(([k, l]) => `<button class="check" data-act="ritual" data-v="${k}" aria-pressed="${!!M.ritual[k]}"><span class="box">${M.ritual[k] ? "✓" : ""}</span>${esc(l)}</button>`).join("")}
    <button class="btn ${all ? "mint" : "primary"} wide" data-act="ritualGo" data-autofocus>${all ? "Listo, a por ello" : "Empezar igualmente"}</button></section>`;
  }
  if (M.step === "ev" || M.step === "check") return top + vEvoke();
  if (M.step === "learn") return top + vLearn();
  if (M.step === "checkIntro") {
    return `${top}<section class="stage stack"><p class="eyebrow">Comprobación</p><h1 style="font-size:30px">Ahora, sin mirar</h1><p class="muted" style="font-size:19px">Intenta recordar lo que acabas de ver. Hoy no suma al 3/3 (hace falta que pase al menos un día), pero te dice qué necesita más relación.</p><button class="btn primary wide" data-act="checkGo" data-autofocus>Vamos</button></section>`;
  }
  return top + vDone();
}
function curItem() { return M.step === "check" ? M.checks[M.ci] : M.queue[M.i]; }
function vEvoke() {
  const it = curItem(), d = deckById(it.deckId), c = getCard(it);
  if (!c) { advance(); return ""; }
  const label = M.step === "check" ? "Comprobación" : it.phase === "again" ? "Segunda oportunidad" : it.free ? "Reto libre" : "Evocación";
  const pos = M.step === "check" ? `${M.ci + 1}/${M.checks.length}` : `${M.i + 1}/${M.queue.length}`;
  let body;
  if (!M.revealed) {
    body = `<label class="f" for="ev-in" style="margin-top:4px">Escribe lo que recuerdes, o dilo en voz alta</label>
    <textarea id="ev-in" rows="4" placeholder="Sin mirar. Si no sale, escribe lo que sí recuerdes." data-autofocus>${esc(M.typed)}</textarea>
    ${M.hint && c.hook ? `<div class="hint"><b class="small">Pista</b><p>${esc(c.hook)}</p></div>` : ""}
    <div class="row">${c.hook && !M.hint ? `<button class="btn ghost" data-act="hint">Pista</button>` : ""}<button class="btn primary" style="flex:1" data-act="reveal">Comprobar</button></div>
    <p class="muted small">Esfuérzate unos segundos más antes de mirar: cuanto más te cuesta recordar, mejor se queda.</p>`;
  } else {
    body = `${M.typed.trim() ? `<div class="mine"><span class="eyebrow">Tu respuesta</span><p style="margin-top:4px">${esc(M.typed)}</p></div>` : ""}
    <div class="answer"><span class="eyebrow" style="color:var(--mint)">Respuesta</span><p class="a">${esc(c.a)}</p>${c.hook ? `<p class="muted small" style="margin-top:8px">Relación: ${esc(c.hook)}</p>` : ""}</div>
    ${sample && M.typed.trim() ? (M.ai ? `<div class="ai">${M.ai.busy ? "Claude está comparando…" : esc(M.ai.text)}</div>` : `<button class="btn sky" data-act="aiCheck">Que Claude revise mi respuesta</button>`) : ""}
    <p class="eyebrow" style="margin-top:4px">¿Cómo te ha salido?</p>
    <div class="grades"><button class="grade ok" data-act="grade" data-v="ok">Lo saqué<small>${M.hint ? "con pista" : "sin mirar"}</small></button><button class="grade mid" data-act="grade" data-v="mid">A medias<small>falta algo</small></button><button class="grade no" data-act="grade" data-v="no">No salió<small>y sirve igual</small></button></div>`;
  }
  return `<section class="stage stack"><div class="qcard" style="--c:${d.color}"><div class="row between"><span class="tag" style="background:${d.color};color:var(--on-bright)">${esc(d.name)}</span><span class="muted small num">${label} · ${pos}</span></div>
  <p class="q">${esc(c.q)}</p><div class="row" style="margin-top:12px"><span class="dots">${[0, 1, 2].map(i => `<i class="${i < c.ok ? "on" : ""}"></i>`).join("")}</span><span class="muted small">${c.ok}/3 evocaciones en días distintos</span></div></div>${body}</section>`;
}
function vLearn() {

  editCard(v) { ui.editCard = v; ui.confirm = null; render(); },
  cancelEdit() { ui.editCard = null; render(); },
  saveCard(v) { const d = deckById(ui.deckId), c = d.cards.find(x => x.id === v); const q = $("#e-q").value.trim(), a = $("#e-a").value.trim(); if (!q || !a) { toast("Pregunta y respuesta no pueden quedar vacías"); return; } c.q = q; c.a = a; c.hook = $("#e-h").value.trim(); touch(d.id); ui.editCard = null; render(); },
  askDel(v) { ui.confirm = v; render(); },
  delCard(v) { const d = deckById(ui.deckId); d.cards = d.cards.filter(c => c.id !== v); touch(d.id); ui.editCard = null; ui.confirm = null; render(); },
  team() { ui.screen = "team"; render(); },
  copyTeam() { copy(ui.teamText, $("#team-text")); },
  gen() { G = null; ui.screen = "gen"; render(); },
  genGo() { genGo(); },
  genStop() { genCtl && genCtl.abort(); },
  genSel(v) { G.notes = ($("#g-notes") || {}).value ?? G.notes; G.sel[v] = G.sel[v] === false; render(); },
  genAdd() { const d = deckById(ui.deckId); let n = 0; G.out.forEach((c, i) => { if (G.sel[i] !== false) { d.cards.push(newCard(c.q, c.a, c.hook)); n++; } }); touch(d.id); G = null; toast(`${n} ${plural(n, "tarjeta añadida", "tarjetas añadidas")}`); A.openDeck(d.id); },
  blank() { startBlank(); },
  blankDone() { B.text = $("#blank-in").value; B.phase = "compare"; clearInterval(blankTimer); render(); scrollTo(0, 0); },
  blankTick(v) { B.got[v] = !B.got[v]; render(); },
  blankSave() {
    const d = deckById(ui.deckId), t = today(); let got = 0;
    d.cards.forEach(c => {
      if (B.got[c.id]) { got++; if (!c.seen) { c.seen = true; c.learned = t; c.due = t + 1; } else grade(d, c, "ok", true); }
      else if (c.seen) { c.due = t; c.restudy = true; }
      else { c.seen = true; c.learned = t; c.due = t + 1; }
    });
    logDay("ev", d.cards.length); logDay("ok", got); const xp = 3 * d.cards.length + 10; addXP(xp); touch(d.id);
    SND.win(); confetti(); toast(`+${xp} XP · ${got}/${d.cards.length} recordadas`); B = null; A.openDeck(d.id);
  },
  fMins(v) { S.profile.focus = Number(v); touch(); render(); },
  fCheck(v) { F.checks[v] = !F.checks[v]; render(); },
  fStart() {
    if (!F.total) { F.total = F.mode === "break" ? 300 : S.profile.focus * 60; F.left = F.total; }
    F.endAt = Date.now() + F.left * 1000; F.running = true; audio(); requestWake();
    clearInterval(focusTimer); focusTimer = setInterval(fTick, 250); render();
  },
  fPause() { F.running = false; clearInterval(focusTimer); F.left = Math.max(0, Math.round((F.endAt - Date.now()) / 1000)); releaseWake(); render(); },
  fReset() { F.running = false; clearInterval(focusTimer); F.total = 0; F.left = 0; F.mode = "focus"; releaseWake(); render(); },
  fNoise() { F.noise = toggleNoise(!F.noise); render(); },
  setGoal(v) { S.profile.goal = Number(v); touch(); render(); },
  sound() { S.profile.sound = !S.profile.sound; touch(); render(); },
  exportData() { const ta = $("#exp"); ta.hidden = false; ta.value = JSON.stringify(S); copy(ta.value, ta); },
  showImport() { ui.importing = true; render(); },
  importData() {
    try { const x = JSON.parse($("#imp").value); if (!x || !x.profile || !Array.isArray(x.decks)) throw 0;
      S.decks.forEach(d => { if (!x.decks.some(n => n.id === d.id)) deleted.add(d.id); });
      S = x; S.decks.forEach(d => dirty.add(d.id)); touch(); ui.importing = false; toast("Datos restaurados"); render();
    } catch { toast("La copia no es válida. Pega el texto completo."); }
  },
};
function newCard(q, a, hook) { return { id: uid(), q: q.slice(0, 500), a: a.slice(0, 1200), hook: (hook || "").slice(0, 240), seen: false, ok: 0, last: null, due: null, learned: null, lapses: 0, created: Date.now() }; }
function copy(text, ta) {
  const done = () => toast("Copiado");
  try { navigator.clipboard.writeText(text).then(done, () => { if (ta) { ta.hidden = false; ta.focus(); ta.select(); } toast("Selecciona el texto y cópialo"); }); }
  catch { if (ta) { ta.hidden = false; ta.focus(); ta.select(); } toast("Selecciona el texto y cópialo"); }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset.v); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ev-in" && M) M.typed = e.target.value;
  if (e.target.id === "blank-in" && B) B.text = e.target.value;
  if (e.target.id === "g-notes" && G) G.notes = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (ui.screen !== "mission" || !M || !(M.step === "ev" || M.step === "check")) return;
  if (!M.revealed && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); A.reveal(); }
  if (M.revealed && e.target.tagName !== "TEXTAREA") { if (e.key === "1") doGrade("ok"); if (e.key === "2") doGrade("mid"); if (e.key === "3") doGrade("no"); }
});

render();
initCloud();
})();
</script>
