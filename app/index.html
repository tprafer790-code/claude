<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

</head><body><title>Sinapsis</title>
<style>
/* Layout: app iOS de una columna (máx. 560px): título grande, listas agrupadas, barra de pestañas translúcida abajo; en misión, pantalla completa con una sola tarea. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E3E3E8; --label:#000000; --secondary:#6C6C70; --sep:#C6C6C8; --chev:#C4C4C7;
  --tint:#5856D6; --tint-strong:#3634A3; --tint-soft:#E5E5FA; --on-white-tint:#3634A3;
  --green:#34C759; --green-text:#1E7A34; --green-soft:#E3F5E8;
  --orange:#FF9500; --orange-text:#A33000; --orange-soft:#FFEBD1;
  --red:#FF3B30; --red-text:#C0000F; --red-soft:#FFE5E7;
  --pink:#FF2D55; --pink-text:#D30F45; --pink-soft:#FFD3DC;
  --teal:#30B0C7; --teal-text:#0071A4; --teal-soft:#CDEEF3;
  --yellow:#FFCC00;
  --bar:rgba(249,249,249,.94); --shadow:0 8px 28px rgba(88,86,214,.14);
  --font:-apple-system,"SF Pro Text","SF Pro Display",BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --label:#FFFFFF; --secondary:#98989F; --sep:#38383A; --chev:#5A5A5E;
  --tint:#5E5CE6; --tint-strong:#A5A3FF; --tint-soft:#24234A;
  --green-text:#30D158; --green-soft:#0F2E17; --orange-text:#FFB340; --orange-soft:#3D2A10;
  --red-text:#FF6961; --red-soft:#3E1414; --pink-text:#FF6482; --pink-soft:#40121D; --teal-text:#5ED8EE; --teal-soft:#0F3238;
  --bar:rgba(22,22,24,.92); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --label:#FFFFFF; --secondary:#98989F; --sep:#38383A; --chev:#5A5A5E;
  --tint:#5E5CE6; --tint-strong:#A5A3FF; --tint-soft:#24234A;
  --green-text:#30D158; --green-soft:#0F2E17; --orange-text:#FFB340; --orange-soft:#3D2A10;
  --red-text:#FF6961; --red-soft:#3E1414; --pink-text:#FF6482; --pink-soft:#40121D; --teal-text:#5ED8EE; --teal-soft:#0F3238;
  --bar:rgba(22,22,24,.92); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
code{font-size:15px;background:var(--fill);padding:1px 5px;border-radius:5px}
.app{position:relative;max-width:560px;margin:0 auto;min-height:100%;padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.app.full{padding-bottom:32px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--secondary)}
.small{font-size:13px}
.eyebrow{font-size:13px;text-transform:uppercase;color:var(--secondary);padding-left:16px}
.num{font-variant-numeric:tabular-nums}

/* Título grande */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
.top .date{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--secondary)}
.top h1,.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.pills{display:flex;gap:8px;padding-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:var(--card);font-weight:600;font-size:15px}
.flame{width:16px;height:16px;flex:none}

/* Nivel */
.level{padding:14px 16px;border-radius:16px;background:var(--card)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--tint);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* Widget de misión */
.hero{border-radius:22px;padding:20px;color:#FFFFFF;background:var(--tint);display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.hero .bigrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big{font-size:64px;line-height:64px;font-weight:800;letter-spacing:-.02em}
.hero .unit{font-size:17px;font-weight:600}
.hero .sub{font-size:15px;opacity:.92}
.cta{display:flex;align-items:center;justify-content:center;width:100%;height:50px;margin-top:12px;border-radius:14px;background:#FFFFFF;color:var(--on-white-tint);font-size:17px;font-weight:600;transition:transform .12s,opacity .12s}
.cta:active{transform:scale(.98);opacity:.85}

/* Anillos */
.rings{border-radius:16px;padding:16px;background:var(--card);display:flex;align-items:center;gap:18px}
.rings svg{width:104px;height:104px;flex:none;transform:rotate(-90deg)}
.rings .lbl{display:flex;flex-direction:column;gap:8px;min-width:0}
.rings .lbl span{display:block;font-size:15px;font-weight:600}
.rings .lbl b{display:block;font-size:20px;font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;font-weight:600;font-size:17px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98);opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--tint);color:#FFFFFF}
.btn.ghost{background:var(--fill);color:var(--label)}
.btn.tinted,.btn.sky{background:var(--tint-soft);color:var(--tint-strong)}
.btn.wide{width:100%}
.btn.mint{background:var(--green);color:#FFFFFF}
.btn.coral{background:var(--red);color:#FFFFFF}
.textbtn{color:var(--tint);font-size:17px;min-height:44px;display:inline-flex;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint-soft);color:var(--tint-strong);flex:none}
.iconbtn svg{width:18px;height:18px}

/* Listas agrupadas */
.group{border-radius:12px;background:var(--card);overflow:hidden}
.group>*{position:relative}
.group>*+*::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.cell{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;min-height:44px;color:inherit;background:var(--card)}
.cell:active{background:var(--fill)}
.cell .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#FFFFFF;font-weight:700;font-size:15px}
.cell .ic svg{width:18px;height:18px}
.cell .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.cell .tx b{font-weight:400;font-size:17px}
.cell .tx span{font-size:13px;color:var(--secondary)}
.chev{width:8px;height:14px;flex:none;color:var(--chev)}
.panel{border-radius:12px;background:var(--card);padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:16px;padding:14px;background:var(--card);min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .v{font-size:32px;font-weight:700}
.tile .k{font-size:13px;font-weight:600}

/* Ley del día */
.law{border-radius:16px;padding:16px;background:var(--card)}
.k{display:inline-block;font-weight:600;font-size:13px;padding:4px 10px;border-radius:999px;color:#FFFFFF}
.law h3{font-size:20px;line-height:25px;font-weight:700;margin-top:10px}
.law .tt{display:grid;gap:8px;margin-top:12px}
.law .tt div{padding:10px 12px;border-radius:10px;background:var(--bg)}
.law .tt b{font-size:13px;font-weight:600;text-transform:uppercase}

/* Mazos */
.deck{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;background:var(--card);color:inherit}
.deck:active{background:var(--fill)}
.group .deck{--inset:72px}
.mono{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--c);color:var(--oc,#FFFFFF);font-weight:700;font-size:20px;flex:none}
.deck .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.deck .name{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--fill);margin-top:3px}
.seg i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--secondary);padding-left:16px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--d);margin-right:5px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:600;background:var(--fill);white-space:nowrap}
.tag.warn{background:var(--orange-soft);color:var(--orange-text)}
.tag.bad{background:var(--red-soft);color:var(--red-text)}
.tag.good{background:var(--green-soft);color:var(--green-text)}
.tag.count{background:var(--tint);color:#FFFFFF}

/* Formularios */
label.f{display:grid;gap:6px;font-size:13px;text-transform:uppercase;color:var(--secondary)}
label.f>input,label.f>textarea{text-transform:none;color:var(--label)}
input[type=text],input[type=date],textarea{width:100%;padding:12px 16px;border-radius:12px;border:0;background:var(--card);font-size:17px;line-height:1.35;-webkit-appearance:none;appearance:none}
input[type=file]{font-size:15px;text-transform:none;color:var(--label)}
textarea{min-height:100px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--tint);outline-offset:0}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--card)}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card),0 0 0 3px transparent}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.check{display:flex;gap:12px;align-items:center;padding:11px 16px;min-height:44px;background:var(--card);text-align:left;width:100%;font-size:17px;color:inherit}
.check .box{width:24px;height:24px;border-radius:50%;border:2px solid var(--chev);display:grid;place-items:center;flex:none;font-size:14px;font-weight:800;color:#FFFFFF}
.check[aria-pressed=true] .box{background:var(--tint);border-color:var(--tint)}
.stack>.check{border-radius:12px}
.seg-ctl{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;padding:2px;border-radius:9px;background:var(--fill)}
.seg-ctl button{height:32px;border-radius:7px;font-size:13px;font-weight:500}
.seg-ctl button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px}
.chipbtn[aria-pressed=true]{background:var(--tint);color:#FFFFFF;font-weight:600}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
[aria-pressed=true] .switch{background:var(--green)}
[aria-pressed=true] .switch::after{transform:translateX(20px)}

/* Pantalla de misión */
.mtop{display:flex;align-items:center;gap:12px;padding-top:6px}
.mtop .bar{flex:1}
.mtop .xp{font-size:15px;font-weight:600;color:var(--tint-strong)}
.stage{margin-top:16px;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(12px);opacity:.2}}
.qcard{border-radius:22px;padding:20px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.qcard .q{font-size:26px;line-height:32px;font-weight:700}
.answer{border-radius:12px;padding:12px 16px;background:var(--card);animation:in .3s ease;display:flex;flex-direction:column;gap:8px}
.answer .a{font-size:17px;font-weight:600;white-space:pre-wrap}
.mine{border-radius:12px;padding:12px 16px;background:var(--card);white-space:pre-wrap}
.hint{border-radius:12px;padding:12px 16px;background:var(--orange-soft);color:var(--label)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{height:76px;border-radius:16px;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.grade:active{transform:scale(.95)}
.grade small{font-weight:500;font-size:12px}
.grade.ok{background:var(--green-soft);color:var(--green-text)}
.grade.mid{background:var(--orange-soft);color:var(--orange-text)}
.grade.no{background:var(--red-soft);color:var(--red-text)}
.ai{border-radius:12px;padding:12px 16px;background:var(--tint-soft)}
.ritual h1,.done h1{font-size:28px;line-height:34px;font-weight:700}
.badge{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;align-self:center;box-shadow:0 12px 30px rgba(52,199,89,.35)}
.badge svg{width:52px;height:52px}

/* Temporizador */
.ring{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:4px auto 0;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:56px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--fill)}

.cardrow{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;background:var(--card);width:100%;text-align:left;color:inherit}
.cardrow:active{background:var(--fill)}
.cardrow .txt{min-width:0;flex:1}
.cardrow .txt b{display:block;font-weight:400;overflow-wrap:anywhere}
.cardrow .txt span{display:block;color:var(--secondary);font-size:13px;overflow-wrap:anywhere}
.dots{display:flex;gap:4px;flex:none;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--chev)}
.dots i.on{background:var(--green);border-color:var(--green)}

details.lawd{border-radius:12px;background:var(--card);padding:0 16px}
details.lawd summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;font-size:17px;min-height:44px}
details.lawd summary::-webkit-details-marker{display:none}
details.lawd .body{display:grid;gap:10px;padding-bottom:14px;font-size:15px;line-height:1.4}

/* Barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);border-top:.5px solid var(--sep);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:10px;font-weight:500;color:var(--secondary);min-height:44px}
.tab svg{width:26px;height:26px}
.tab[aria-current=page]{color:var(--tint)}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;padding:12px 20px;border-radius:999px;background:var(--card);color:var(--label);font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:pop .35s cubic-bezier(.2,1.3,.4,1);max-width:calc(100% - 32px);text-align:center}
@keyframes pop{from{transform:translate(-50%,-30px) scale(.9);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.empty{text-align:center;padding:24px 16px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.onb{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.onb .art{width:120px;height:120px;border-radius:28px;display:grid;place-items:center;color:#FFFFFF;font-size:40px;font-weight:800;letter-spacing:-.02em}
.onb h1{font-size:30px;line-height:36px;font-weight:700}
.onb .dotsnav{display:flex;gap:8px}.onb .dotsnav i{width:8px;height:8px;border-radius:50%;background:var(--fill)}.onb .dotsnav i.on{background:var(--tint)}
.sync{font-size:13px;color:var(--secondary);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero .big{font-size:52px}.grade{font-size:15px}.qcard .q{font-size:22px;line-height:28px}}
</style>

<div class="app" id="app"></div>
<div class="tabs" id="tabs"></div>
<canvas id="confetti" hidden></canvas>

<script>
(() => {
"use strict";
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o));
const dayOf = (d = new Date()) => Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5);
const today = () => dayOf();
const dateToDay = (v) => { if (!v) return null; const [y, m, d] = v.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
const dayToDate = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, s, p) => n === 1 ? s : (p || s + "s");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const COLORS = ["#5856D6", "#34C759", "#FF9500", "#007AFF", "#FF2D55", "#AF52DE", "#30B0C7", "#FFCC00"];
const onColor = (c) => { const h = String(c).replace("#", ""); if (h.length !== 6) return "#FFFFFF"; const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.4 ? "#1C1C1E" : "#FFFFFF"; };
const mono = (d, cls = "mono") => `<span class="${cls}" style="--c:${d.color};--oc:${onColor(d.color)}">${esc(d.name.trim().charAt(0).toUpperCase() || "?")}</span>`;
const CHEV = `<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m1 1 6 6-6 6"/></svg>`;
const backBtn = (act, v, label) => `<button class="textbtn" data-act="${act}" ${v ? `data-v="${v}"` : ""}><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:4px"><path d="M10 2 2 10l8 8"/></svg>${esc(label)}</button>`;
const INTERVALS = [0, 2, 4]; // días hasta la siguiente evocación tras 1 y 2 aciertos (mínimo un día entre evocaciones)
const MAINTAIN = 14;          // repaso de mantenimiento cuando ya está dominada
const LEVELS = ["Neurona", "Dendrita", "Axón", "Sinapsis", "Red neuronal", "Hipocampo", "Corteza", "Mente en llamas", "Cerebro galáctico"];

/* ============ Las seis leyes (Aprender a aprender, Héctor Ruiz Martín) ============ */
const LAWS = [
  { k: "Relaciona", c: "#007AFF", t: "Tu cerebro solo guarda lo que puede enganchar a algo que ya sabe.",
    truqui: "Busca a qué te recuerda: una palabra parecida, un ejemplo, una imagen, una historia absurda.",
    anti: "Repetir y repetir sin entender: se esfuma enseguida.",

/* ============ Lógica de aprendizaje ============ */
function deckById(id) { return S.decks.find(d => d.id === id); }
function cardState(c) {
  if (!c.seen) return "new";
  if (c.ok >= 3) return "done";
  return "way";
}
function isDue(c, t = today()) { return c.seen && c.due != null && c.due <= t; }
function deckStats(d) {
  const s = { new: 0, way: 0, done: 0, due: 0, total: d.cards.length };
  d.cards.forEach(c => { s[cardState(c)]++; if (isDue(c)) s.due++; });
  return s;
}
function allStats() {
  const s = { new: 0, way: 0, done: 0, due: 0, total: 0 };
  S.decks.forEach(d => { const x = deckStats(d); for (const k in s) s[k] += x[k]; });
  return s;
}
function clampToExam(d, due) {

  return due;
}

function grade(deck, card, r, counts = true) {

    if (eligible) {

      card.due = card.ok >= 3 ? t + MAINTAIN : t + Math.max(1, INTERVALS[card.ok]);

    card.restudy = false;
  } else if (r === "mid") {
    card.due = t + 1;
  } else {
    if (counts) { card.ok = 0; card.lapses = (card.lapses || 0) + 1; }
    card.due = t + 1; card.restudy = true;
  }
  card.due = clampToExam(deck, card.due);
  return counted;
}

  d[field] = (d[field] || 0) + n;

${notes.slice(0, 12000)}`;

/* ---------- Misión ---------- */
function startMission(opts = {}) {
  const t = today();
  let due = dueItems(opts.deckId), news = newItems(opts.deckId);
  let queue, learn;
  if (opts.quick) {
    queue = interleave(due).slice(0, 3);
    if (queue.length < 3) {
      const seen = []; S.decks.forEach(d => d.cards.forEach(c => { if (c.seen && !queue.some(q => q.cardId === c.id) && c.last !== t) seen.push({ deckId: d.id, cardId: c.id }); }));
      queue = queue.concat(shuffle(seen).slice(0, 3 - queue.length).map(x => ({ ...x, free: true })));
    }
    learn = queue.length ? [] : interleave(news).slice(0, 2);
  } else {
    queue = interleave(due).slice(0, opts.deckId ? 30 : S.profile.goal);
    learn = interleave(news).slice(0, 5);
    if (!queue.length && !learn.length) {
      const seen = []; S.decks.forEach(d => { if (opts.deckId && d.id !== opts.deckId) return; d.cards.forEach(c => { if (c.seen) seen.push({ deckId: d.id, cardId: c.id, free: true }); }); });
      queue = interleave(seen).slice(0, opts.deckId ? 10 : 3);
    }
  }
  M = { from: ui.screen === "deck" ? "deck" : null, step: opts.quick ? null : "ritual", queue: queue.map(x => ({ ...x, phase: "ev" })), i: 0, learn, li: 0, checks: [], ci: 0,
    res: { ok: 0, mid: 0, no: 0, counted: 0 }, xp: 0, t0: Date.now(), revealed: false, typed: "", hint: false, ai: null, ritual: {}, again: new Set() };
  if (!M.step) M.step = nextStep(null);
  ui.screen = "mission"; render(); scrollTo(0, 0);
}
function nextStep(cur) {
  const order = ["ritual", "ev", "learn", "checkIntro", "check", "done"];
  let i = cur ? order.indexOf(cur) + 1 : 1;
  for (; i < order.length; i++) {
    const s = order[i];
    if (s === "ev" && !M.queue.length) continue;
    if (s === "learn" && !M.learn.length) continue;
    if ((s === "checkIntro" || s === "check") && !M.checks.length) continue;
    return s;
  }
  return "done";
}
function vMission() {
  if (!M) { ui.screen = null; return vHoy(); }
  const total = M.queue.length + M.learn.length + M.checks.length;
  const doneN = M.i + M.li + M.ci;
  const top = `<div class="mtop"><button class="textbtn" data-act="quitMission">Cerrar</button><div class="bar"><i style="width:${total ? doneN / total * 100 : 0}%"></i></div><span class="xp num">+${M.xp} XP</span></div>`;
  if (M.step === "ritual") {
    const items = [["phone", "Móvil fuera de la mesa o en modo avión"], ["music", "Sin música ni vídeos de fondo"], ["water", "Agua a mano (y algo de comer si hay hambre)"], ["one", "Solo esta tarea abierta"]];
    const all = items.every(([k]) => M.ritual[k]);

  onbNext() { if (ui.onb < 2) { ui.onb++; render(); } else { S.profile.onboarded = true; touch(); render(); } },
  onbSkip() { S.profile.onboarded = true; touch(); render(); },
  mission(v) { if (v === "nodeck") { ui.form = {}; ui.screen = "newdeck"; render(); return; } startMission(); },
  quick() { if (!allStats().total) { toast("Primero crea un mazo con tarjetas"); return; } startMission({ quick: true }); },
  missionDeck() { startMission({ deckId: ui.deckId }); },
  ritual(v) { M.ritual[v] = !M.ritual[v]; render(); },
  ritualGo() { M.step = nextStep("ritual"); if (M.step === "done") onDone(); render(); },
  reveal() { M.typed = ($("#ev-in") || {}).value || ""; M.revealed = true; render(); },
  hint() { M.typed = ($("#ev-in") || {}).value || ""; M.hint = true; render(); },
  grade(v) { doGrade(v); },
  aiCheck() { aiCheck(); },
  explained() { M.explained = !M.explained; render(); },
  learnNext() {
    const it = M.learn[M.li], c = getCard(it), d = deckById(it.deckId);
    const hook = ($("#ln-hook").value || "").trim();
    let xp = 5; if (hook && hook !== (c.hook || "")) xp += 5; if (M.explained) xp += 3;
    c.hook = hook; c.seen = true; c.learned = today(); c.due = today() + 1; c.ok = 0;
    addXP(xp); M.xp += xp; touch(d.id);
    M.checks.push({ deckId: it.deckId, cardId: c.id }); M.explained = false;
    M.li++; if (M.li >= M.learn.length) { M.checks = interleave(M.checks); M.step = nextStep("learn"); if (M.step === "done") onDone(); }
    toast(`+${xp} XP`); render(); scrollTo(0, 0);
  },
  checkGo() { M.step = "check"; render(); },
  refl(v) { M.refl = v; S.profile.reflections = [...(S.profile.reflections || []), { d: today(), r: v }].slice(-60); touch(); render(); },
  finish() { const from = M && M.from; M = null; ui.screen = from; render(); scrollTo(0, 0); },
  quitMission() { const from = M && M.from; M = null; ui.screen = from; render(); scrollTo(0, 0); },
  newDeck() { ui.form = { color: COLORS[S.decks.length % COLORS.length] }; ui.screen = "newdeck"; render(); },
  pickColor(v) { ui.form.name = ($("#nd-name") || {}).value ?? ui.form.name; ui.form.exam = ($("#nd-exam") || {}).value ?? ui.form.exam; ui.form.color = v; const keepName = $("#ds-name") && $("#ds-name").value; const keepExam = $("#ds-exam") && $("#ds-exam").value; render(); if (keepName != null && $("#ds-name")) { $("#ds-name").value = keepName; $("#ds-exam").value = keepExam; } },
  createDeck() {
    const name = ($("#nd-name").value || "").trim(); if (!name) { toast("Ponle un nombre al mazo"); return; }
    const d = { id: uid(), name: name.slice(0, 60), color: ui.form.color || COLORS[0], exam: dateToDay($("#nd-exam").value), order: Date.now(), cards: [] };
    S.decks.push(d); touch(d.id); ui.deckId = d.id; ui.screen = "add"; ui.prev = "deck"; render();
  },
  openDeck(v) { ui.deckId = v; ui.screen = "deck"; ui.prev = "deck"; ui.editCard = null; ui.confirm = null; ui.form = {}; G = null; B = null; render(); scrollTo(0, 0); },
  back() { ui.screen = null; ui.tab = ui.tab || "mazos"; render(); },
  deckSet() { ui.form = {}; ui.confirm = null; ui.screen = "deckset"; render(); },
  saveDeck() {
    const d = deckById(ui.deckId), name = ($("#ds-name").value || "").trim(); if (!name) { toast("El nombre no puede quedar vacío"); return; }
    d.name = name.slice(0, 60); d.color = ui.form.color || d.color; d.exam = dateToDay($("#ds-exam").value);
    d.cards.forEach(c => { if (c.due != null) c.due = clampToExam(d, c.due); });
    touch(d.id); toast("Guardado"); A.openDeck(d.id);
  },
  resetDeck() { const d = deckById(ui.deckId); d.cards.forEach(c => Object.assign(c, { seen: false, ok: 0, last: null, due: null, learned: null, lapses: 0, restudy: false })); touch(d.id); toast("Progreso reiniciado"); A.openDeck(d.id); },
  askDelDeck() { ui.confirm = "deck"; render(); },
  delDeck() { const id = ui.deckId; S.decks = S.decks.filter(d => d.id !== id); deleted.add(id); dirty.delete(id); touch(); ui.screen = null; ui.tab = "mazos"; ui.confirm = null; toast("Mazo borrado"); render(); },
  add() { ui.screen = "add"; render(); },
  addOne() {
    const q = $("#a-q").value.trim(), a = $("#a-a").value.trim(), hook = $("#a-h").value.trim();
    if (!q || !a) { toast("Escribe pregunta y respuesta"); return; }
    const d = deckById(ui.deckId); d.cards.push(newCard(q, a, hook)); touch(d.id); toast(`Añadida · ${d.cards.length} en el mazo`);
    $("#a-q").value = ""; $("#a-a").value = ""; $("#a-h").value = ""; $("#a-q").focus();
  },
  addBulk() {
    const d = deckById(ui.deckId), lines = $("#a-bulk").value.split("\n"); let n = 0;
    lines.forEach(l => { const p = l.includes("::") ? l.split("::") : l.split("|"); if (p.length >= 2 && p[0].trim() && p[1].trim()) { d.cards.push(newCard(p[0].trim(), p[1].trim(), (p[2] || "").trim())); n++; } });
    if (!n) { toast("No encontré líneas con el formato pregunta :: respuesta"); return; }
    touch(d.id); toast(`${n} ${plural(n, "tarjeta añadida", "tarjetas añadidas")}`); A.openDeck(d.id);
  },
  editCard(v) { ui.editCard = v; ui.confirm = null; render(); },
  cancelEdit() { ui.editCard = null; render(); },
  saveCard(v) { const d = deckById(ui.deckId), c = d.cards.find(x => x.id === v); const q = $("#e-q").value.trim(), a = $("#e-a").value.trim(); if (!q || !a) { toast("Pregunta y respuesta no pueden quedar vacías"); return; } c.q = q; c.a = a; c.hook = $("#e-h").value.trim(); touch(d.id); ui.editCard = null; render(); },
  askDel(v) { ui.confirm = v; render(); },
  delCard(v) { const d = deckById(ui.deckId); d.cards = d.cards.filter(c => c.id !== v); touch(d.id); ui.editCard = null; ui.confirm = null; render(); },
  team() { ui.screen = "team"; render(); },
  copyTeam() { copy(ui.teamText, $("#team-text")); },
  gen() { G = null; ui.screen = "gen"; render(); },
  genGo() { genGo(); },
  genStop() { genCtl && genCtl.abort(); },
  genSel(v) { G.notes = ($("#g-notes") || {}).value ?? G.notes; G.sel[v] = G.sel[v] === false; render(); },
  genAdd() { const d = deckById(ui.deckId); let n = 0; G.out.forEach((c, i) => { if (G.sel[i] !== false) { d.cards.push(newCard(c.q, c.a, c.hook)); n++; } }); touch(d.id); G = null; toast(`${n} ${plural(n, "tarjeta añadida", "tarjetas añadidas")}`); A.openDeck(d.id); },
  blank() { startBlank(); },
  blankDone() { B.text = $("#blank-in").value; B.phase = "compare"; clearInterval(blankTimer); render(); scrollTo(0, 0); },
  blankTick(v) { B.got[v] = !B.got[v]; render(); },
  blankSave() {
    const d = deckById(ui.deckId), t = today(); let got = 0;
    d.cards.forEach(c => {
      if (B.got[c.id]) { got++; if (!c.seen) { c.seen = true; c.learned = t; c.due = t + 1; } else grade(d, c, "ok", true); }
      else if (c.seen) { c.due = t; c.restudy = true; }
      else { c.seen = true; c.learned = t; c.due = t + 1; }
    });
    logDay("ev", d.cards.length); logDay("ok", got); const xp = 3 * d.cards.length + 10; addXP(xp); touch(d.id);
    SND.win(); confetti(); toast(`+${xp} XP · ${got}/${d.cards.length} recordadas`); B = null; A.openDeck(d.id);
  },
  fMins(v) { S.profile.focus = Number(v); touch(); render(); },
  fCheck(v) { F.checks[v] = !F.checks[v]; render(); },
  fStart() {
    if (!F.total) { F.total = F.mode === "break" ? 300 : S.profile.focus * 60; F.left = F.total; }
    F.endAt = Date.now() + F.left * 1000; F.running = true; audio(); requestWake();
    clearInterval(focusTimer); focusTimer = setInterval(fTick, 250); render();
  },
  fPause() { F.running = false; clearInterval(focusTimer); F.left = Math.max(0, Math.round((F.endAt - Date.now()) / 1000)); releaseWake(); render(); },
  fReset() { F.running = false; clearInterval(focusTimer); F.total = 0; F.left = 0; F.mode = "focus"; releaseWake(); render(); },
  fNoise() { F.noise = toggleNoise(!F.noise); render(); },
  setGoal(v) { S.profile.goal = Number(v); touch(); render(); },
  sound() { S.profile.sound = !S.profile.sound; touch(); render(); },
  exportData() { const ta = $("#exp"); ta.hidden = false; ta.value = JSON.stringify(S); copy(ta.value, ta); },
  showImport() { ui.importing = true; render(); },
  importData() {
    try { const x = JSON.parse($("#imp").value); if (!x || !x.profile || !Array.isArray(x.decks)) throw 0;
      S.decks.forEach(d => { if (!x.decks.some(n => n.id === d.id)) deleted.add(d.id); });
      S = x; S.decks.forEach(d => dirty.add(d.id)); touch(); ui.importing = false; toast("Datos restaurados"); render();
    } catch { toast("La copia no es válida. Pega el texto completo."); }
  },
};
function newCard(q, a, hook) { return { id: uid(), q: q.slice(0, 500), a: a.slice(0, 1200), hook: (hook || "").slice(0, 240), seen: false, ok: 0, last: null, due: null, learned: null, lapses: 0, created: Date.now() }; }
function copy(text, ta) {
  const done = () => toast("Copiado");
  try { navigator.clipboard.writeText(text).then(done, () => { if (ta) { ta.hidden = false; ta.focus(); ta.select(); } toast("Selecciona el texto y cópialo"); }); }
  catch { if (ta) { ta.hidden = false; ta.focus(); ta.select(); } toast("Selecciona el texto y cópialo"); }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b.dataset.v); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ev-in" && M) M.typed = e.target.value;
  if (e.target.id === "blank-in" && B) B.text = e.target.value;
  if (e.target.id === "g-notes" && G) G.notes = e.target.value;
});
document.addEventListener("keydown", (e) => {
  if (ui.screen !== "mission" || !M || !(M.step === "ev" || M.step === "check")) return;
  if (!M.revealed && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); A.reveal(); }
  if (M.revealed && e.target.tagName !== "TEXTAREA") { if (e.key === "1") doGrade("ok"); if (e.key === "2") doGrade("mid"); if (e.key === "3") doGrade("no"); }
});

render();
initCloud();
})();
</script>
