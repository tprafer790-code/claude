<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lanternwing</title>
  <script>
    // rewarded: true solo cuando CrazyGames confirme el Full Launch (ver docs/04-publicacion.md)
    window.LW_CONFIG = { rewarded: false };
  </script>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    :root {
      --gold: #ffd36b;
      --gold-2: #ffb347;
      --ink: #0b1220;
      --panel: rgba(14, 22, 40, 0.92);
      --line: rgba(255, 211, 107, 0.35);
      --text: #f4ecd8;
      --muted: #a9b3c9;
      --fs: clamp(13px, 2.4vmin, 22px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #060a14; color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      font-size: var(--fs);
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #bg { position: fixed; left: 0; top: 0; z-index: 0; will-change: transform; background-color: #0e1a22;
      background-repeat: repeat; pointer-events: none; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; }
    #vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(circle farthest-corner at center, rgba(3,5,12,0) 25%, rgba(3,5,12,0.35) 60%, rgba(3,5,12,0.82) 100%); }
    .overlay, #pauseBtn, #loading { z-index: 10; }
    .overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
               max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: rgba(4, 7, 15, 0.55);
    }
    .overlay.show { display: flex; }
    .panel {
      background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
      padding: 1.1em 1.4em; max-width: min(92vw, 760px); max-height: 94vh; overflow: auto;
      text-align: center; box-shadow: 0 0 40px rgba(255, 200, 90, 0.15);
    }
    h1, h2 { margin: 0.1em 0 0.3em; color: var(--gold); letter-spacing: 0.04em; }
    h1 { font-size: 2.2em; }
    h2 { font-size: 1.6em; }
    p { margin: 0.3em 0 0.7em; color: var(--muted); }
    button {
      font: inherit; color: var(--ink); background: linear-gradient(var(--gold), var(--gold-2));
      border: 0; border-radius: 12px; padding: 0.6em 1.3em; margin: 0.3em; cursor: pointer;
      font-weight: bold; min-height: 44px; min-width: 44px;
    }
    button.secondary { background: #26324d; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: 0.45; cursor: default; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.2em; }
    .cards { display: flex; gap: 0.8em; justify-content: center; flex-wrap: wrap; margin-top: 0.4em; }
    .card {
      width: min(30vw, 210px); min-height: 9em; display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; gap: 0.25em; background: #18233d; color: var(--text);
      border: 2px solid var(--line); border-radius: 14px; padding: 0.7em 0.5em; margin: 0;
    }
    .card:hover, .card:focus-visible { border-color: var(--gold); transform: translateY(-2px); }
    .card .icon { width: 2.6em; height: 2.6em; border-radius: 50%; }
    .card .name { color: var(--gold); font-weight: bold; }
    .card .desc { font-weight: normal; font-size: 0.85em; color: var(--muted); }
    .card .tag { font-size: 0.75em; color: var(--ink); background: var(--gold); border-radius: 6px; padding: 0 0.4em; }
    .card .key { font-size: 0.7em; color: var(--muted); }
    table.stats { margin: 0.4em auto 0.8em; border-collapse: collapse; }
    table.stats td { padding: 0.15em 0.7em; text-align: left; }
    table.stats td:last-child { text-align: right; color: var(--gold); font-weight: bold; }
    .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(13em, 1fr)); gap: 0.5em; margin: 0.6em 0; }
    .shop .item {
      background: #18233d; border: 1px solid var(--line); border-radius: 12px; padding: 0.5em 0.6em;
      display: flex; flex-direction: column; align-items: center; gap: 0.15em;
    }
    .shop .item .name { color: var(--gold); font-weight: bold; }
    .shop .item .desc { font-size: 0.85em; color: var(--muted); }
    #home { background: rgba(4, 7, 15, 0.82); }
    #home .panel { width: min(94vw, 820px); padding: 0.8em 1em; }
    #home h1 { font-size: 1.8em; margin: 0; }
    #home .shop { grid-template-columns: repeat(3, 1fr); }
    @media (max-aspect-ratio: 1/1) { #home .shop { grid-template-columns: repeat(2, 1fr); } }
    #home .shop .item { padding: 0.35em 0.4em; }
    #home .shop .item button { margin: 0.15em 0 0; padding: 0.35em 0.8em; min-height: 36px; }
    .night { align-items: center; gap: 0.5em; }
    .night .desc { font-size: 0.8em; color: var(--muted); }
    .tabs button { margin: 0.15em; padding: 0.35em 0.9em; min-height: 36px; }
    .tabs button.on { background: linear-gradient(var(--gold), var(--gold-2)); color: var(--ink); }
    .shop .item.sel { border-color: var(--gold); box-shadow: 0 0 12px rgba(255, 211, 107, 0.3); }
    .swatch { width: 1.8em; height: 1.8em; border-radius: 50%; display: inline-block; }
    .bar { width: 90%; height: 0.55em; background: #0b1220; border-radius: 4px; overflow: hidden; display: block; margin: 0.2em 0; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold-2), var(--gold)); }
    #resMsg { font-size: 0.9em; }
    .pips { letter-spacing: 0.15em; color: var(--gold); }
    .nectar { color: var(--gold); font-weight: bold; }
    .msg { min-height: 1.3em; color: var(--gold); }
    #pauseBtn {
      position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
      width: 44px; height: 44px; padding: 0; margin: 0; border-radius: 50%;
      background: rgba(20, 30, 52, 0.75); color: var(--text); border: 1px solid var(--line); display: none;
      font-size: 18px;
    }
    #pauseBtn.show { display: block; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #060a14; color: var(--gold); font-size: 1.4em; letter-spacing: 0.1em;
    }
    .ad-icon { display: inline-block; width: 1.1em; height: 0.8em; border-radius: 3px; background: currentColor;
      vertical-align: -0.05em; margin-right: 0.35em; position: relative; }
    .ad-icon::after { content: ""; position: absolute; left: 0.4em; top: 0.18em; border-left: 0.35em solid var(--gold);
      border-top: 0.22em solid transparent; border-bottom: 0.22em solid transparent; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="game" aria-label="Lanternwing"></canvas>
  <div id="vignette"></div>
  <button id="pauseBtn" aria-label="Pause">❚❚</button>

  <div id="levelUp" class="overlay"><div class="panel">
    <h2 data-i18n="chooseUpgrade"></h2>
    <div class="cards" id="cards"></div>
  </div></div>

  <div id="pause" class="overlay"><div class="panel">
    <h2 data-i18n="paused"></h2>
    <p data-i18n="controlsHint"></p>
    <div class="row">
      <button id="resumeBtn" data-i18n="resume"></button>
      <button id="soundBtn" class="secondary"></button>
    </div>
    <div class="row">
      <button id="restartBtn" class="secondary" data-i18n="restart"></button>
      <button id="homeBtn" class="secondary" data-i18n="home"></button>
    </div>
  </div></div>

  <div id="results" class="overlay"><div class="panel">
    <h2 id="resTitle"></h2>
    <p id="resSub"></p>
    <table class="stats" id="resStats"></table>
    <div class="msg" id="resMsg"></div>
    <div class="row">
      <button id="rewardBtn" class="secondary"></button>
    </div>
    <div class="row">
      <button id="againBtn" data-i18n="playAgain"></button>
      <button id="toHomeBtn" class="secondary" data-i18n="upgrades"></button>
    </div>
  </div></div>

  <div id="home" class="overlay"><div class="panel">
    <h1>Lanternwing</h1>
    <p data-i18n="tagline"></p>
    <div><span data-i18n="nectar"></span>: <span class="nectar" id="homeNectar"></span>
      · <span data-i18n="bestTime"></span>: <span class="nectar" id="homeBest"></span></div>
    <div class="row night">
      <button id="nightPrev" class="secondary" aria-label="Previous night">◀</button>
      <div><div id="nightLabel" class="nectar"></div><div id="nightDesc" class="desc"></div></div>
      <button id="nightNext" class="secondary" aria-label="Next night">▶</button>
      <button id="playBtn" data-i18n="play"></button>
    </div>
    <div class="row tabs">
      <button class="tab secondary" data-tab="upgrades" data-i18n="upgrades"></button>
      <button class="tab secondary" data-tab="moths" data-i18n="moths"></button>
      <button class="tab secondary" data-tab="missions" data-i18n="missions"></button>
    </div>
    <div class="shop" id="shop"></div>
    <p data-i18n="controlsHint" style="font-size:0.8em;margin:0"></p>
  </div></div>

  <div id="loading">LANTERNWING</div>

  <script src="src/i18n.js"></script>
  <script src="src/sdk.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/meta.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
